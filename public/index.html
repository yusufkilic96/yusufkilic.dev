<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Yusuf Kılıç — Work in Progress</title>
  <meta
    name="description"
    content="Yusuf Kılıç — Personal website coming soon..."
  >

  <style>
    :root {
      color-scheme: dark;
      --background: #0a0a0a;
      --foreground: #ededed;
      --muted: #737373;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;

      background: var(--background);
      color: var(--foreground);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 720px;
    }

    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 700;
      letter-spacing: -0.06em;
      line-height: 0.95;
    }

    .message {
      max-width: 520px;
      margin: 2rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.7;
    }

    footer {
      margin-top: 4rem;
      padding-top: 1rem;
      border-top: 1px solid #1f1f1f;

      color: #525252;
      font-size: 0.8rem;
    }

    a {
      color: var(--foreground);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    @media (prefers-reduced-motion: no-preference) {
      main {
        animation: appear 0.7s ease-out both;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(12px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>

</head>

<body>
  <main>
    <p class="eyebrow">yusufkilic.dev</p>

<h1>Work<br>in progress.</h1>

<p class="message">
  I'm putting some things together.
  This site will be home to my work, projects,
  and things I find interesting.
</p>

<footer>
  © <span id="year"></span> Yusuf Kılıç
</footer>

  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>

</body>
</html>
